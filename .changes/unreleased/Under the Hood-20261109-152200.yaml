body: 'Bound package archive size and entry count: stream package downloads and cap their size, and check entry count and uncompressed size before extracting. Limits are configurable with DBT_PACKAGE_MAX_DOWNLOAD_BYTES, DBT_PACKAGE_MAX_UNCOMPRESSED_BYTES and DBT_PACKAGE_MAX_FILES.'
